<!DOCTYPE html>

<head>

<body>
    <div id="kuroi">
        <h1><img src="./images/kuroilogo.png" alt=""></h1>
        <img src="./images/maruko.PNG" alt="">


        <h2>ABOUT</h2>

        </p>
    </div>
    <h2>GALLERY</h2>
    <div id="carousel">
        <figure id="spinner">
            <a href="magazin.html"><img src="./images/magazin1.png" alt></a>
            <img src="./images/akari.png" alt>
            <img src="./images/pecora.png" alt>
            <img src="./images/kimagurenodemukae.png" alt>
            <img src="./images/otakunokyuujitu.png" alt>
            <img src="./images/mizugiwa.png" alt>
            <img src="./lake-tekapo.jpg" alt>
            <img src="./milford-sound.jpg" alt>
        </figure>
    </div>
    <span style="float:left" class="ss-icon" onclick="galleryspin('-')">&lt;</span>
    <span style="float:right" class="ss-icon" onclick="galleryspin('')">&gt;</span>

    <h2>CONTACT</h2>
    <section>

    </section>
    <footer>&copy;kuroi</footer>
    <script>
        var angle = 0;
        function galleryspin(sign) {
            spinner = document.querySelector("#spinner");
            if (!sign) { angle = angle + 45; } else { angle = angle - 45; }
            spinner.setAttribute("style", "-webkit-transform: rotateY(" + angle + "deg); -moz-transform: rotateY(" + angle + "deg); transform: rotateY(" + angle + "deg);");
        }
    </script>
</body>
